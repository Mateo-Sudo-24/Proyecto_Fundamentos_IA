<!-- templates/index.html CORREGIDO -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detector de Actividad Lícita</title>
</head>
<body>
    <h1>Detector de Actividad Financiera</h1>
    <form method="POST">
        <!-- Campos para variables numéricas -->
        <label for="sumValTot">Suma del Valor Total:</label><br>
        <input type="number" step="any" id="sumValTot" name="sumValTot" required><br><br>

        <label for="Frecuencia">Frecuencia:</label><br>
        <input type="number" id="Frecuencia" name="Frecuencia" required><br><br>

        <label for="edad">Edad:</label><br>
        <input type="number" id="edad" name="edad" required><br><br>

        <label for="nivelIngresos">Nivel de Ingresos:</label><br>
        <input type="number" step="any" id="nivelIngresos" name="nivelIngresos" required><br><br>

        <!-- Campos para variables categóricas -->
        <label for="estadoCivil">Estado Civil:</label><br>
        <select id="estadoCivil" name="estadoCivil">
            <option value="S">Soltero</option>
            <option value="C">Casado</option>
            <option value="D">Divorciado</option>
            <option value="V">Viudo</option>
            <option value="U">Unión Libre</option>
        </select><br><br>

        <label for="nivelEducacion">Nivel de Educación:</label><br>
        <input type="text" id="nivelEducacion" name="nivelEducacion" required><br><br>

        <label for="sexo">Sexo:</label><br>
        <select id="sexo" name="sexo">
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
        </select><br><br>

        <label for="tipoVivienda">Tipo de Vivienda:</label><br>
        <input type="text" id="tipoVivienda" name="tipoVivienda" required><br><br>

        <!-- Selección del modelo -->
        <label for="modelo">Seleccione el modelo:</label><br>
        <select id="modelo" name="modelo">
            <option value="logistica">Regresión Logística</option>
            <option value="arbol">Árbol de Decisión</option>
        </select><br><br>

        <button type="submit">Predecir</button>
    </form>

    {% if prediccion is not none %}
        <h2>Resultado de la Predicción ({{ modelo_usado }}):</h2>
        <p>
            {% if prediccion == 1 %}
                Actividad Sospechosa (UAFE)
            {% else %}
                Actividad No Sospechosa
            {% endif %}
        </p>
    {% endif %}
</body>
</html>
